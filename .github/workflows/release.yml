name: Build and release

# Builds CloseAll.exe and publishes a GitHub release whenever the version in
# src/Program.cs changes to one that doesn't have a release yet.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          v=$(grep -oP 'AssemblyVersion\("\K[0-9]+\.[0-9]+\.[0-9]+' src/Program.cs)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$v is already released, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Mono
        if: steps.ver.outputs.exists == 'false'
        run: sudo apt-get update -q && sudo apt-get install -y -q mono-devel

      - name: Build
        if: steps.ver.outputs.exists == 'false'
        run: ./build.sh

      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        run: |
          notes="$(cat release-notes.md 2>/dev/null || echo "Close All ${{ steps.ver.outputs.version }}")"
          gh release create "v${{ steps.ver.outputs.version }}" build/CloseAll.exe \
            --title "Close All ${{ steps.ver.outputs.version }}" --notes "$notes"
        env:
          GH_TOKEN: ${{ github.token }}
